# Cấu hình gửi email (quên mật khẩu). Sao chép file này thành mail.properties (cùng thư mục)
# rồi điền thông tin thật của máy mình. KHÔNG commit mail.properties (đã nằm trong .gitignore).
#
# Không có mail.properties, hoặc cả mail.brevo.apiKey và mail.host đều để trống: ứng dụng chạy ở CHẾ ĐỘ PHÁT TRIỂN,
# không gửi email thật mà in nội dung email (kèm liên kết đặt lại mật khẩu) ra console của Tomcat.
#
# Có hai cách gửi email thật (chọn MỘT; có cả hai thì dùng Brevo):
#   A. Brevo API (qua HTTPS cổng 443): dùng khi LÊN HOSTING (Render gói miễn phí chặn cổng SMTP).
#   B. SMTP: dùng khi chạy trên máy cá nhân.

# ---- Cách A: Brevo API ----
# Khóa API (API key) tạo trong Brevo: SMTP & API > API Keys. Đây là bí mật, chỉ điền vào mail.properties.
#mail.brevo.apiKey=YOUR_BREVO_API_KEY
# Người gửi: BẮT BUỘC là địa chỉ đã được xác minh trong Brevo (Senders, domains & dedicated IPs > Senders)
#mail.from=YOUR_VERIFIED_SENDER_EMAIL
#mail.fromName=Motorbike Shop

# ---- Cách B: SMTP ----

mail.host=smtp.gmail.com
mail.port=587
# true: dùng STARTTLS (cổng 587). Nếu dùng SSL trực tiếp (cổng 465) thì đặt mail.ssl=true và mail.starttls=false
mail.starttls=true
mail.ssl=false
# Để trống mail.username nếu máy chủ SMTP không yêu cầu đăng nhập
mail.username=YOUR_EMAIL
mail.password=YOUR_APP_PASSWORD
mail.from=YOUR_EMAIL

# Địa chỉ gốc của website, dùng để tạo liên kết trong email. BẮT BUỘC khi gửi email thật
# (không lấy từ yêu cầu của người dùng để tránh bị giả mạo tiêu đề Host).
app.baseUrl=http://localhost:8080

# Thời hạn của liên kết đặt lại mật khẩu (phút) và số lần yêu cầu tối đa mỗi giờ cho một tài khoản
reset.expireMinutes=30
reset.maxPerHour=5
