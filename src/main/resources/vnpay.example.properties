# Cấu hình thanh toán VNPay Sandbox. Sao chép file này thành vnpay.properties (cùng thư mục)
# rồi điền thông tin tài khoản sandbox của MÁY MÌNH. KHÔNG commit vnpay.properties (đã nằm trong .gitignore).
#
# Không có vnpay.properties, hoặc còn giá trị YOUR_...: VNPay bị khóa ở trang thanh toán, chỉ chọn được COD.
#
# TmnCode và HashSecret do VNPay gửi qua email khi đăng ký tài khoản sandbox
# (https://sandbox.vnpayment.vn/devreg/). HashSecret là mã bí mật dùng để ký giao dịch, không chia sẻ cho ai.
vnpay.tmnCode=YOUR_TMN_CODE
vnpay.hashSecret=YOUR_HASH_SECRET

# Địa chỉ cổng thanh toán sandbox (mặc định đã đúng, thường không cần đổi)
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Địa chỉ ĐẦY ĐỦ mà VNPay đưa trình duyệt quay về sau khi trả tiền = địa chỉ website của bạn + /vnpay/return.
# Phải trùng với cách bạn mở website (cổng và context path). Ví dụ chạy ở máy cá nhân:
vnpay.returnUrl=http://localhost:8080/vnpay/return

# Thời gian khách được trả tiền trên cổng VNPay (phút, từ 5 đến 60)
vnpay.expireMinutes=15
