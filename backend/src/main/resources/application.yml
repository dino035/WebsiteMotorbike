spring:
  application:
    name: motoparts-backend

  datasource:
    # Project Supabase của Tiểu luận. Không ghi mật khẩu vào file này:
    # đặt biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD (IntelliJ: Run Configuration > Environment variables).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motoparts_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # TODO: chuyển sang 'validate' + Flyway/Liquibase khi schema đã ổn định
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    # Khóa ký JWT (>= 32 ký tự), đặt bằng biến môi trường JWT_SECRET. Để trống: dùng khóa ngẫu nhiên mỗi lần chạy.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    # Địa chỉ React được gọi API (cách nhau bằng dấu phẩy). Dev: Vite 3000 (hoặc 5173); deploy: tên miền Static Site trên Render.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}   # gốc địa chỉ React, dùng tạo liên kết trong email
  reset:
    expire-minutes: ${RESET_EXPIRE_MINUTES:30}   # thời hạn liên kết đặt lại mật khẩu
    max-per-hour: ${RESET_MAX_PER_HOUR:5}        # số lần yêu cầu tối đa mỗi giờ cho một tài khoản
  mail:
    # Gửi email: ưu tiên Brevo API (HTTPS 443, dùng được trên Render vì Render chặn cổng SMTP),
    # rồi tới SMTP. Không cấu hình cả hai: chế độ phát triển, nội dung email (kèm liên kết) chỉ in ra log.
    from: ${MAIL_FROM:}                      # địa chỉ người gửi (với Brevo phải là địa chỉ đã xác minh)
    from-name: ${MAIL_FROM_NAME:MotoParts}
    brevo-api-key: ${BREVO_API_KEY:}
    smtp-host: ${MAIL_HOST:}
    smtp-port: ${MAIL_PORT:587}
    smtp-username: ${MAIL_USERNAME:}
    smtp-password: ${MAIL_PASSWORD:}
    smtp-starttls: ${MAIL_STARTTLS:true}
  cart:
    hold-minutes: ${CART_HOLD_MINUTES:30}   # thời gian tạm giữ một chiếc xe khi nằm trong giỏ
  llm:
    # Chat AI gọi Gemini (Google AI Studio). Khóa chỉ đặt bằng biến môi trường GEMINI_API_KEY, không ghi vào code hay Git.
    # Chưa đặt khóa: chat vẫn chạy nhưng mọi câu hỏi được ghi lại là chưa trả lời được.
    gemini-api-key: ${GEMINI_API_KEY:}
    # Mặc định dùng bản lite: gemini-flash-latest từng treo quá thời gian chờ, các bản flash đầy đủ hay báo 503 quá tải.
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:20}
  vnpay:
    # Thanh toán VNPay Sandbox. Mã website và khóa bí mật chỉ đặt bằng biến môi trường, không ghi vào code hay Git.
    # Thiếu VNPAY_TMN_CODE hoặc VNPAY_HASH_SECRET: VNPay bị khóa, đặt hàng chỉ cho COD.
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    # Địa chỉ VNPay đưa trình duyệt của khách quay về sau khi trả tiền: trang React, trang này gọi lại /api/payments/vnpay/return.
    return-url: ${VNPAY_RETURN_URL:${app.frontend-url}/payment/vnpay-return}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}   # thời gian khách được trả tiền trên cổng VNPay (5 đến 60 phút)
  chat:
    max-messages-per-hour: ${CHAT_MAX_MESSAGES_PER_HOUR:30}   # số câu hỏi tối đa của một tài khoản mỗi giờ (giữ hạn mức Gemini)
  admin:
    # Tùy chọn: tạo admin đầu tiên khi khởi động nếu đặt cả hai biến.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  supabase:
    # Lưu ảnh sản phẩm trên Supabase Storage. Khóa service_role là bí mật:
    # chỉ đặt bằng biến môi trường SUPABASE_KEY, không ghi vào file này.
    url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_BUCKET:photos}
    key: ${SUPABASE_KEY:}

server:
  port: ${PORT:8080}
