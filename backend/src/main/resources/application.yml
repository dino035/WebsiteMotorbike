spring:
  application:
    name: motoparts-backend

  datasource:
    # Project Supabase của Tiểu luận. Không ghi mật khẩu vào file này:
    # đặt biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD (IntelliJ: Run Configuration > Environment variables).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motoparts_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # TODO: chuyển sang 'validate' + Flyway/Liquibase khi schema đã ổn định
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Khóa ký JWT (>= 32 ký tự), đặt bằng biến môi trường JWT_SECRET. Để trống: dùng khóa ngẫu nhiên mỗi lần chạy.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    # Địa chỉ React được gọi API (cách nhau bằng dấu phẩy). Dev: Vite 5173; deploy: tên miền Static Site trên Render.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Tùy chọn: tạo admin đầu tiên khi khởi động nếu đặt cả hai biến.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

server:
  port: ${PORT:8080}
